name: Build and Push to AWS EC2

on:
  push:
    branches:
      - main # Triggers the workflow whenever you push to the main branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    # Add these permissions to your job
    permissions:
      id-token: write # Required to request the OIDC JWT token
      contents: read  # Required for actions like actions/checkout

    steps:
      # 1. Check out the repository code
      - name: Checkout Code
        uses: actions/checkout@v6

      # Step 2: Authenticate to AWS using OIDC
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::325054522547:role/Ekameva_Engineering
          aws-region: eu-north-1b
          audience: ://amazonaws.com

      # Step 3: Verify the connection by interacting with AWS
      - name: Test AWS Connection
        run: |
          aws sts get-caller-identity

      # 4. Install dependencies and compile the build
      - name: Install & Build
        run: |
          make package

      # 5. Copy the package to the EC2 instance using SCP
      - name: Copy Build to EC2 via SCP
        uses: appleboy/scp-action@v0.1.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "dist/helloworld-0.0.1.tar.gz"
          target: "/home/${{ secrets.EC2_USERNAME }}/app-deploy/"

      # 6. Connect via SSH, extract the build, and restart the server
      - name: Deploy and Restart Application via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/${{ secrets.EC2_USERNAME }}/app-deploy/
            
            # Extract the new build files
            tar -xzf helloworld-0.0.1.tar.gz
            
            # Clean up the archive
            rm helloworld-0.0.1.tar.gz
