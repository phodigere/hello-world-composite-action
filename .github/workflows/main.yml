on: [push]

jobs:
  hello_world_job:
    runs-on: ubuntu-latest
    name: A job to say hello
    steps:
      - uses: actions/checkout@v6
      - id: foo
        uses: phodigere/hello-world-composite-action@30c52e2966fdfa0d5c61fa125be7b877d7d27fb7
        with:
          who-to-greet: 'The only one: Ekameva'
      - run: echo random-number "$RANDOM_NUMBER"
        shell: bash
        env:
          RANDOM_NUMBER: ${{ steps.foo.outputs.random-number }}
